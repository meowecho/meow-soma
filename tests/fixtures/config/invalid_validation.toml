[project]
name = "   "
default_profile = "missing-profile"

[runtime]
default_provider = "ollama"
max_steps = 0
concurrency = 0
retry_budget = 2

[security]
approval_policy = "unsupported"
allowlist = ["ls"]
denylist = ["rm -rf /"]

[storage]
root_dir = "./tmp/test-fixtures/root"
sqlite_path = "./tmp/test-fixtures/state.db"
memory_dir = "./tmp/test-fixtures/memory"
artifacts_dir = "./tmp/test-fixtures/artifacts"
logs_dir = "./tmp/test-fixtures/logs"

[mcp]
enabled = true
transport = "stdio"
bind = "127.0.0.1:7777"

[providers.ollama]
model = "llama3.1:8b"
endpoint = "http://127.0.0.1:11434"
timeout_secs = 5

[[profiles]]
name = "default"
tools = ["echo"]
temperature = 0.2
