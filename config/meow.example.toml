[project]
name = "meow-soma"
default_profile = "default"

[runtime]
default_provider = "ollama"
max_steps = 20
concurrency = 2
retry_budget = 2

[security]
approval_policy = "permission_gate"
allowlist = ["ls", "pwd", "cat", "rg", "git status", "git diff"]
denylist = ["rm -rf /", "mkfs", "dd if=", "git reset --hard"]

[storage]
root_dir = "~/.meow-soma"
sqlite_path = "~/.meow-soma/state.db"
memory_dir = "~/.meow-soma/memory"
artifacts_dir = "~/.meow-soma/artifacts"
logs_dir = "~/.meow-soma/logs"

[mcp]
enabled = true
transport = "stdio"
bind = "127.0.0.1:7777"

[providers.openai]
model = "gpt-4.1"
endpoint = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_secs = 60

[providers.anthropic]
model = "claude-3-7-sonnet-latest"
endpoint = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
timeout_secs = 60

[providers.ollama]
model = "llama3.1:8b"
endpoint = "http://127.0.0.1:11434"
timeout_secs = 60

[[profiles]]
name = "default"
model = "llama3.1:8b"
tools = ["shell", "fs.read", "echo"]
temperature = 0.2
