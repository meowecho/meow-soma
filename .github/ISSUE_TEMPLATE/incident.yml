name: Production Incident
description: Report a production-impacting incident for launch/post-launch triage.
title: "incident: <short impact summary>"
labels:
  - triage
  - incident
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - severity/p0
        - severity/p1
        - severity/p2
        - severity/p3
    validations:
      required: true

  - type: input
    id: started_at
    attributes:
      label: Incident start time (UTC)
      placeholder: "2026-03-04T09:00:00Z"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who is affected and what is broken?
    validations:
      required: true

  - type: textarea
    id: mitigation
    attributes:
      label: Current mitigation or workaround
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Reproduction details
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area/runtime
        - area/provider
        - area/tui
        - area/mcp
        - area/tools
        - area/state
    validations:
      required: true

  - type: textarea
    id: next_steps
    attributes:
      label: Next actions
      value: |
        1) Assign owner
        2) Decide patch/rollback
        3) Post status update cadence
    validations:
      required: true
