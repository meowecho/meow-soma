[package]
name = "meow-soma"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "meow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
dirs = "6.0.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.0.3"
uuid = { version = "1.21.0", features = ["v4", "serde"] }
